# Daily checks on third-party dependencies, each waiting out a 7-day cooldown
# so a release has time to be withdrawn before it reaches a site.
version: 2
updates:
  # The @museumwnf platform packages (viewer-core, viewer-layout, viewer-i18n)
  # and this site's data package are IGNORED here — not because Dependabot
  # cannot reach them (they publish publicly to npmjs now, no token needed),
  # but because they are updated deliberately through the release-then-
  # propagate procedure in metanull/viewer-workflows (`tools/propagate.mjs`),
  # which opens one pull request per site right after each platform or data
  # release. A Dependabot bump of the same package would race that procedure
  # rather than replace it.
  #
  # Nothing is lost by it: third-party dependencies and GitHub Actions below
  # are unaffected and keep flowing normally.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@museumwnf/*"

  # The reusable workflows in metanull/viewer-workflows are pinned to an exact
  # version in .github/workflows/*.yml, never to a moving major tag. Dependabot
  # covers reusable-workflow refs as well as step-level actions, so a new
  # viewer-workflows release arrives here as a pull request that runs this
  # site's own CI before it is adopted — instead of a force-moved `v1`
  # deploying untested CI to every repo at once. Green minor/patch bumps
  # auto-merge via automerge.yml; majors wait for a human.
  #
  # This ecosystem is unaffected by the problem above: it resolves against the
  # GitHub API, not against npm.pkg.github.com.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
